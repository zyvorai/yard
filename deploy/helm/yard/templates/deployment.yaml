{{- if and (gt (int .Values.replicaCount) 1) (not (or (hasPrefix "postgres://" .Values.databaseUrl) (hasPrefix "postgresql://" .Values.databaseUrl))) }}
{{- fail "replicaCount greater than 1 requires a postgres:// database URL" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yard.name" . }}
  labels:
    {{- include "yard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "yard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yard.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: yard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: YARD_LISTEN
              value: {{ .Values.listen | quote }}
            - name: YARD_DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: YARD_MODE
              value: {{ .Values.mode | quote }}
            - name: YARD_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: YARD_SECRET_KEY
              value: {{ .Values.secretKey | quote }}
            - name: YARD_CORS_ORIGINS
              value: {{ .Values.corsOrigins | quote }}
            - name: YARD_EGRESS_ALLOWLIST
              value: {{ .Values.egressAllowlist | quote }}
            - name: YARD_ALLOW_INSECURE_TLS
              value: {{ .Values.allowInsecureTLS | quote }}
            - name: YARD_TIMESCALE
              value: {{ .Values.timescale | quote }}
            {{- if .Values.oidc.enabled }}
            - name: YARD_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: YARD_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: YARD_OIDC_CLIENT_SECRET
              value: {{ .Values.oidc.clientSecret | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/yard
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "yard.name" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
