<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yard hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  yard-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:112px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Asset operations platform</span></div>
  <div class="word">Yard</div>
  <div class="tag">Every asset, every site.<br><em>Stale is never healthy.</em></div>
  <div class="lede">Open registry for devices, sites, telemetry, incidents and work orders. Runs alone; Zyvor connectors are optional.</div>
  <div class="stats"><div class="stat"><b>4</b><span>opt. connectors</span></div><div class="stat"><b>3</b><span>RBAC roles</span></div><div class="stat"><b>2</b><span>DB backends</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/yard</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// Yard: isometric site. A tiled yard of assets (towers, cabinets, sensors, a vehicle); one stale asset,
// one incident beacon and a work-order pin.
var C = Z.c, OX = 400, OY = 178, TW = 72, TH = 36, N = 7;
var d = Z.el('defs', {});
d.innerHTML = '<filter id="ydgl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="ydsf" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>' +
  '<radialGradient id="ydfloor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2997ff" stop-opacity=".22"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>' +
  '<linearGradient id="ydbeam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff453a" stop-opacity=".55"/><stop offset="1" stop-color="#ff453a" stop-opacity="0"/></linearGradient>';
function P(i, j, h) { return [OX + (i - j) * TW / 2, OY + (i + j) * TH / 2 - (h || 0)]; }
function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }

Z.el('ellipse', { cx: OX, cy: OY + N * TH / 2, rx: 330, ry: 190, fill: 'url(#ydfloor)' });
// faint dot texture far left
for (var k = 0; k < 40; k++) Z.el('circle', { cx: 70 + Z.rnd() * 110, cy: 40 + Z.rnd() * 380, r: .8 + Z.rnd() * 1.2, fill: C.cyan, opacity: (.08 + Z.rnd() * .25).toFixed(2) });

// ground slab edge
var slab = 10;
Z.el('polygon', { points: pts([P(0, N), P(N, N), P(N, N, -slab), P(0, N, -slab)]), fill: 'rgba(20,40,70,.85)' });
Z.el('polygon', { points: pts([P(N, 0), P(N, N), P(N, N, -slab), P(N, 0, -slab)]), fill: 'rgba(12,26,48,.9)' });
// tiles
for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
  var road = (j === 2);
  var f = road ? 'rgba(41,151,255,.10)' : 'rgba(' + (14 + Z.rnd() * 8 | 0) + ',' + (30 + Z.rnd() * 14 | 0) + ',' + (56 + Z.rnd() * 20 | 0) + ',.75)';
  Z.el('polygon', { points: pts([P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)]), fill: f, stroke: 'rgba(100,170,255,.16)', 'stroke-width': .8 });
}
// road dashes
for (var i = 0; i < N; i++) { var a = P(i + .3, 2.5), b = P(i + .7, 2.5); Z.el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: 'rgba(100,210,255,.35)', 'stroke-width': 1.2 }); }

function box(i, j, w, dpt, h, col, op) {
  var x0 = i + (1 - w) / 2, y0 = j + (1 - dpt) / 2, x1 = x0 + w, y1 = y0 + dpt;
  op = op || 1;
  Z.el('polygon', { points: pts([P(x0, y1), P(x1, y1), P(x1, y1, h), P(x0, y1, h)]), fill: col, opacity: (.55 * op).toFixed(2) });
  Z.el('polygon', { points: pts([P(x1, y0), P(x1, y1), P(x1, y1, h), P(x1, y0, h)]), fill: col, opacity: (.35 * op).toFixed(2) });
  Z.el('polygon', { points: pts([P(x0, y0, h), P(x1, y0, h), P(x1, y1, h), P(x0, y1, h)]), fill: col, opacity: (.9 * op).toFixed(2), stroke: 'rgba(255,255,255,.35)', 'stroke-width': .6 });
  return P(i + .5, j + .5, h);
}
function led(p, col) { Z.el('circle', { cx: p[0], cy: p[1] - 5, r: 2.6, fill: col, filter: 'url(#ydgl)' }); }
function tower(i, j, h, col) {
  var b = P(i + .5, j + .5), t = P(i + .5, j + .5, h);
  var l = P(i + .2, j + .5), r = P(i + .8, j + .5);
  Z.el('polyline', { points: pts([l, t, r]), fill: 'none', stroke: col, 'stroke-width': 1.4, opacity: .8 });
  for (var s = 1; s < 4; s++) { var y = s / 4; var a = [l[0] + (t[0] - l[0]) * y, l[1] + (t[1] - l[1]) * y], c = [r[0] + (t[0] - r[0]) * y, r[1] + (t[1] - r[1]) * y]; Z.el('line', { x1: a[0], y1: a[1], x2: c[0], y2: c[1], stroke: col, 'stroke-width': .8, opacity: .5 }); }
  for (var w = 1; w <= 2; w++) Z.el('path', { d: 'M' + (t[0] - 7 * w) + ',' + (t[1] - 3 * w) + ' Q' + t[0] + ',' + (t[1] - 9 * w) + ' ' + (t[0] + 7 * w) + ',' + (t[1] - 3 * w), fill: 'none', stroke: C.cyan, 'stroke-width': 1, opacity: (.7 / w).toFixed(2) });
  Z.el('circle', { cx: t[0], cy: t[1], r: 2.6, fill: '#fff', filter: 'url(#ydgl)' });
  return t;
}
function sensor(i, j, col) { var p = box(i, j, .22, .22, 8, col); Z.el('circle', { cx: p[0], cy: p[1], r: 7, fill: 'none', stroke: col, opacity: .5 }); Z.el('circle', { cx: p[0], cy: p[1], r: 2, fill: col, filter: 'url(#ydgl)' }); return p; }

// draw back-to-front (by i+j)
var items = [
  [0, 0, function () { led(box(0, 0, .55, .7, 28, '#2a5fa8'), C.green); }],
  [1, 0, function () { tower(1, 0, 78, C.signal); }],
  [3, 0, function () { sensor(3, 0, C.cyan); }],
  [4, 0, function () { led(box(4, 0, .8, .6, 36, '#2a5fa8'), C.green); }],
  [6, 1, function () { tower(6, 1, 66, C.signal); }],
  [0, 3, function () { led(box(0, 3, .7, .7, 24, '#2a5fa8'), C.green); }],
  [0, 5, function () { sensor(0, 5, C.cyan); }],
  [1, 5, function () { var p = box(1, 5, .6, .6, 22, '#5a6a80', .55); Z.el('circle', { cx: p[0], cy: p[1] - 5, r: 2.6, fill: '#8e9aab' }); }],
  [2, 2, function () { box(2, 2, .7, .4, 13, '#40c8e0'); box(2.18, 2, .3, .36, 22, '#40c8e0'); }],
  [3, 4, function () { sensor(3, 4, C.cyan); }],
  [5, 3, function () { box(5, 3, .8, .8, 50, '#ff6a5a', .55); }],
  [5, 5, function () { led(box(5, 5, .6, .6, 26, '#2a5fa8'), C.green); }],
  [6, 4, function () { sensor(6, 4, C.cyan); }],
  [2, 6, function () { led(box(2, 6, .55, .55, 18, '#2a5fa8'), C.green); }],
  [4, 2, function () { sensor(4, 2, C.cyan); }]
];
items.sort(function (a, b) { return (a[0] + a[1]) - (b[0] + b[1]); });
items.forEach(function (it) { it[2](); });

// stale ring on the grey asset
var st = P(1.5, 5.5);
Z.el('ellipse', { cx: st[0], cy: st[1], rx: 30, ry: 15, fill: 'none', stroke: '#8e9aab', 'stroke-dasharray': '3 4', 'stroke-width': 1.2 });

// incident beacon on the hot cabinet (5,5)
var ib = P(5.5, 3.5), it = P(5.5, 3.5, 50);
Z.el('ellipse', { cx: ib[0], cy: ib[1], rx: 52, ry: 26, fill: C.red, opacity: .18, filter: 'url(#ydsf)' });
[22, 36, 50].forEach(function (r, n) { Z.el('ellipse', { cx: ib[0], cy: ib[1], rx: r, ry: r / 2, fill: 'none', stroke: C.red, 'stroke-width': 1.4, opacity: (.8 - n * .22).toFixed(2) }); });
Z.el('polygon', { points: (it[0] - 14) + ',' + (it[1] - 120) + ' ' + (it[0] + 14) + ',' + (it[1] - 120) + ' ' + (it[0] + 4) + ',' + it[1] + ' ' + (it[0] - 4) + ',' + it[1], fill: 'url(#ydbeam)' });
Z.el('circle', { cx: it[0], cy: it[1] - 2, r: 5, fill: C.red, filter: 'url(#ydgl)' });

// work-order pin on the vehicle (3,3)
var wp = P(2.5, 2.5, 22);
var px = wp[0], py = wp[1] - 50;
Z.el('line', { x1: px, y1: py + 14, x2: wp[0], y2: wp[1], stroke: C.amber, 'stroke-width': 1.4, 'stroke-dasharray': '2 3' });
Z.el('path', { d: 'M' + px + ',' + (py + 16) + ' C' + (px - 18) + ',' + (py - 2) + ' ' + (px - 14) + ',' + (py - 22) + ' ' + px + ',' + (py - 22) + ' C' + (px + 14) + ',' + (py - 22) + ' ' + (px + 18) + ',' + (py - 2) + ' ' + px + ',' + (py + 16) + 'Z', fill: C.amber, filter: 'url(#ydgl)' });
Z.el('circle', { cx: px, cy: py - 6, r: 5, fill: '#1a1206' });

// telemetry motes rising from the site
for (var k = 0; k < 26; k++) { var q = P(Z.rnd() * N, Z.rnd() * N, 20 + Z.rnd() * 90); Z.el('circle', { cx: q[0], cy: q[1], r: .8 + Z.rnd() * 1.3, fill: C.cyan, opacity: (.2 + Z.rnd() * .45).toFixed(2) }); }
// labels
Z.label(it[0] + 90, it[1] - 108, '<b class="bad">incident</b><span>temp=84.3</span>', 'box');
Z.label(px - 96, py - 10, '<b class="warn">work order</b><span>inspection</span>', 'box');
Z.label(st[0] - 30, st[1] + 52, '<b>stale</b><span>missed heartbeat</span>', 'box');
Z.label(400, 540, '<b>site-a</b><span>devices &middot; telemetry &middot; incidents</span>');
Z.label(560, 52, 'SQLite &middot; Postgres &middot; MapLibre', 'chip');
})();
</script>
</body>
</html>
