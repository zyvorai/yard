name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: |
          mkdir -p dist
          for pair in linux/amd64 linux/arm64; do
            os=${pair%/*}
            arch=${pair#*/}
            suffix="${os}-${arch}"
            GOOS=$os GOARCH=$arch go build -o "dist/yard-${suffix}" ./cmd/yard
            GOOS=$os GOARCH=$arch go build -o "dist/yard-simulator-${suffix}" ./cmd/simulator
            GOOS=$os GOARCH=$arch go build -o "dist/yard-agent-gateway-${suffix}" ./cmd/agent-gateway
          done
          go version -m dist/yard-linux-amd64 > dist/sbom.txt
          cd dist
          sha256sum yard-* sbom.txt > SHA256SUMS
      - uses: sigstore/cosign-installer@v3.8.1
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yard-linux-amd64
            dist/yard-linux-arm64
            dist/yard-simulator-linux-amd64
            dist/yard-simulator-linux-arm64
            dist/yard-agent-gateway-linux-amd64
            dist/yard-agent-gateway-linux-arm64
            dist/sbom.txt
            dist/SHA256SUMS
            dist/SHA256SUMS.bundle
