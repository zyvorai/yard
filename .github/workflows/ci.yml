name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race and coverage
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build binaries (embeds web)
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yard
          POSTGRES_PASSWORD: yard
          POSTGRES_DB: yard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yard -d yard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Postgres integration tests
        env:
          YARD_TEST_POSTGRES: postgres://yard:yard@127.0.0.1:5432/yard?sslmode=disable
        run: go test -tags=integration ./internal/store/ -count=1 -v

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: SQLite backup/restore round-trip
        run: |
          chmod +x scripts/ci/backup-restore.sh scripts/backup.sh scripts/restore.sh
          ./scripts/ci/backup-restore.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm --prefix website ci
      - run: npm --prefix website run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: helm lint deploy/helm/yard
      - name: Helm template + kubeconform
        run: |
          helm template yard deploy/helm/yard \
            --set image.repository=yard --set image.tag=ci \
            --set persistence.enabled=false \
            > /tmp/yard.yaml
          kubeconform -summary -strict /tmp/yard.yaml
